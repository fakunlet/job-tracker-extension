spring.application.name=job-application-tracker

# 5332 is the host port mapped to the container's 5432 in docker-compose.yml.
spring.datasource.url=jdbc:postgresql://localhost:5332/jobtracker
spring.datasource.username=apiuser
spring.datasource.password=apipass

# Hibernate creates and updates tables from the entity classes. Convenient for
# a small project like this; a real one would use migrations (see DECISIONS.md).
spring.jpa.hibernate.ddl-auto=update

# Logs every SQL statement Hibernate runs, so it's possible to see exactly what
# the app does to the database.
spring.jpa.show-sql=true
